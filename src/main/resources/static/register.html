<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud Storage - Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>☁ Cloud Storage</h1>

        <h2>Create Account</h2>

        <p class="subtitle">
            Create your cloud storage account
        </p>

        <form id="registerForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                >

            </div>


            <button
                    type="submit"
                    class="btn">
                Register
            </button>


            <p id="message"></p>

        </form>


        <p class="switch-page">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>


<script src="js/register.js"></script>

<link rel="stylesheet" href="css/style.css">
<script src="js/register.js"></script>
</body>

</html>
